name: Feature request
description: Suggest an improvement or a new capability
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that the current behaviour does not support?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What would you like to see? Include the API, CLI or data format if relevant.
    validations:
      required: true
  - type: textarea
    id: evaluation
    attributes:
      label: How it would be measured
      description: Changes to the resolver should state the metric and the split they would be judged on, and the expected result. See CONTRIBUTING.md.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
