name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest --cov=tahdeed --cov-fail-under=70
  package:
    # The wheel and sdist build, install into a clean environment and contain the dashboard.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - run: |
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/pip install dist/*.whl
          /tmp/wheel-check/bin/tahdeed --help > /dev/null
          /tmp/wheel-check/bin/python -c "import tahdeed, pathlib; assert (pathlib.Path(tahdeed.__file__).parent / 'web' / 'index.html').exists()"
  bench-drift:
    # Gulf-AddressBench: the committed data, prediction files, score files and docs/BENCH_REPORT.md
    # must reproduce exactly from each other (no gazetteer or model needed). Fails on any drift.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -c constraints.txt -e .
      - run: python scripts/check_bench_drift.py
  docs-regen:
    # Generated documents must equal what their scripts render from the committed result files.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/make_evaluation_md.py
      - run: python scripts/make_results_blocks.py
      - run: python scripts/make_edge_proposal.py
      - run: git diff --exit-code -- docs README.md
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # advisory: a new advisory against a pinned dependency should be visible without blocking unrelated work
      - run: pip install pip-audit && pip-audit -r constraints.txt --no-deps
        continue-on-error: true
  # The image build + smoke test lives in docker.yml (it builds the image as its first step).
