[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tahdeed"
version = "2.1.0"
description = "Bilingual Arabic/English UAE address resolver with calibrated confidence and abstention"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Huda Mueen" }]
keywords = [
  "geocoding",
  "address resolution",
  "Arabic",
  "United Arab Emirates",
  "OpenStreetMap",
  "calibration",
  "abstention",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Natural Language :: Arabic",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: GIS",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]
dependencies = [
  "rapidfuzz>=3.6",
  "numpy>=1.26",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
build = ["osmium>=3.7"]
train = ["scikit-learn>=1.4"]
external = ["duckdb>=1.0", "scikit-learn>=1.4"]  # `bench fetch-external` and the TF-IDF baseline
typecheck = ["mypy>=1.10"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6",
  "httpx>=0.27",
  "ruff>=0.4",
  "mypy>=1.10",
  "pre-commit>=3.7",
  "build>=1.2",
  "osmium>=3.7",
  "scikit-learn>=1.4",
]

[project.urls]
Homepage = "https://github.com/hudasol/tahdeed"
Source = "https://github.com/hudasol/tahdeed"
Issues = "https://github.com/hudasol/tahdeed/issues"
Changelog = "https://github.com/hudasol/tahdeed/blob/main/CHANGELOG.md"
Documentation = "https://github.com/hudasol/tahdeed/tree/main/docs"

[project.scripts]
tahdeed = "tahdeed.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tahdeed = ["py.typed", "web/*", "web/vendor/*", "web/vendor/images/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["tahdeed"]
omit = ["*/build.py", "*/figures.py", "*/studies.py", "*/train.py", "*/parallel.py", "*/poi_ablation.py", "*/clarify.py"]  # offline experiment drivers, run by scripts/reproduce.sh

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "E402", "E741", "B008"]

[tool.mypy]
python_version = "3.11"
files = ["src/tahdeed"]
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
no_implicit_optional = true

# Baseline: these modules have known annotation gaps that predate the type check. Fix a module,
# then remove it from this list so the check tightens over time.
[[tool.mypy.overrides]]
module = [
  "tahdeed.bench",
  "tahdeed.calibrate",
  "tahdeed.clarify",
  "tahdeed.cli",
  "tahdeed.evaluate",
  "tahdeed.figures",
  "tahdeed.gold",
  "tahdeed.human",
  "tahdeed.parse",
  "tahdeed.resolve",
  "tahdeed.standardize",
]
ignore_errors = true
