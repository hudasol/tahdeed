[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tahdeed"
version = "2.0.0"
description = "Bilingual Arabic/English UAE address resolver with calibrated confidence and abstention"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Huda Mueen" }]
dependencies = [
  "rapidfuzz>=3.6",
  "numpy>=1.26",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
build = ["osmium>=3.7"]
train = ["scikit-learn>=1.4"]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6", "httpx>=0.27", "ruff>=0.4", "osmium>=3.7", "scikit-learn>=1.4"]

[project.scripts]
tahdeed = "tahdeed.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tahdeed = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["tahdeed"]
omit = ["*/build.py", "*/figures.py", "*/studies.py", "*/train.py", "*/parallel.py"]  # offline experiment drivers, run by scripts/reproduce.sh

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "E402", "E741", "B008"]
